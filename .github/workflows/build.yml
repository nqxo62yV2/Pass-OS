name: PassOS Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build x86-64 + ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            nasm binutils xorriso mtools \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            qemu-system-x86

      - name: Build debug ISO (serial markers enabled)
        run: |
          NASMFLAGS="-DDEBUG_SERIAL" bash scripts/build.sh
          bash scripts/makeiso.sh

      - name: Verify kernel ELF / Multiboot2 layout
        run: |
          echo "=== ELF header ==="
          readelf -h build/kernel.elf
          echo "=== Program headers ==="
          readelf -l build/kernel.elf
          echo "=== Multiboot2 check ==="
          grub-file --is-x86-multiboot2 build/kernel.elf && echo "valid multiboot2 image"

      - name: Boot smoke test (QEMU)
        run: bash scripts/test_boot.sh build/passos.iso

      - name: Build release artifacts (serial markers disabled)
        run: |
          bash scripts/build.sh
          bash scripts/makeiso.sh

      - name: Show build artifact sizes
        run: |
          echo "=== Build Artifacts ==="
          ls -lh build/kernel.elf build/kernel.bin build/passos.iso

      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: passos-x86_64-kernel
          path: build/kernel.bin
          retention-days: 30

      - name: Upload ISO image
        uses: actions/upload-artifact@v4
        with:
          name: passos-x86_64-iso
          path: build/passos.iso
          retention-days: 30

  build-arm64:
    name: Build ARM64 (best effort)
    runs-on: ubuntu-latest
    # The shared kernel modules are currently x86-64 NASM sources, so the
    # ARM64 port is incomplete. Do not block the x86-64 build/release on it.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm binutils-aarch64-linux-gnu

      - name: Create build directories
        run: mkdir -p build/arm/obj

      - name: Assemble ARM64 boot entry
        run: |
          aarch64-linux-gnu-as \
            -o build/arm/obj/boot_arm.o \
            boot/arm/boot_arm.asm

      - name: Assemble ARM64 kernel modules
        run: |
          for src in \
            kernel/kernel.asm \
            kernel/memory.asm \
            kernel/interrupts.asm \
            kernel/scheduler.asm \
            kernel/system.asm \
            drivers/display/display.asm \
            drivers/keyboard/keyboard.asm \
            drivers/storage/storage.asm \
            drivers/usb/usb.asm \
            drivers/hardware/hardware.asm \
            security/key_derivation.asm \
            security/encryption.asm \
            security/secure_memory.asm \
            security/authentication.asm \
            security/integrity.asm \
            database/database_storage.asm \
            database/database.asm \
            database/database_create.asm \
            database/database_delete.asm \
            database/database_search.asm \
            database/database_export.asm \
            interface/terminal.asm \
            interface/command_parser.asm \
            interface/table.asm \
            interface/navigation.asm \
            interface/text_editor.asm \
            interface/commands.asm \
            settings/settings.asm \
            updates/update.asm \
            installer/installer.asm
          do
            base=$(basename "$src" .asm)
            nasm -f elf64 "$src" -o "build/arm/obj/${base}.o"
          done

      - name: Link ARM64 kernel
        run: |
          aarch64-linux-gnu-ld \
            -T scripts/linker_arm.ld \
            -o build/arm/kernel_arm.elf \
            build/arm/obj/boot_arm.o \
            build/arm/obj/kernel.o \
            build/arm/obj/memory.o \
            build/arm/obj/interrupts.o \
            build/arm/obj/scheduler.o \
            build/arm/obj/system.o \
            build/arm/obj/display.o \
            build/arm/obj/keyboard.o \
            build/arm/obj/storage.o \
            build/arm/obj/usb.o \
            build/arm/obj/hardware.o \
            build/arm/obj/key_derivation.o \
            build/arm/obj/encryption.o \
            build/arm/obj/secure_memory.o \
            build/arm/obj/authentication.o \
            build/arm/obj/integrity.o \
            build/arm/obj/database_storage.o \
            build/arm/obj/database.o \
            build/arm/obj/database_create.o \
            build/arm/obj/database_delete.o \
            build/arm/obj/database_search.o \
            build/arm/obj/database_export.o \
            build/arm/obj/terminal.o \
            build/arm/obj/command_parser.o \
            build/arm/obj/table.o \
            build/arm/obj/navigation.o \
            build/arm/obj/text_editor.o \
            build/arm/obj/commands.o \
            build/arm/obj/settings.o \
            build/arm/obj/update.o \
            build/arm/obj/installer.o

      - name: Extract ARM64 flat binary
        run: |
          aarch64-linux-gnu-objcopy \
            -O binary \
            build/arm/kernel_arm.elf \
            build/arm/kernel_arm.bin

      - name: Show ARM64 artifact size
        run: ls -lh build/arm/kernel_arm.bin

      - name: Upload ARM64 kernel
        uses: actions/upload-artifact@v4
        with:
          name: passos-arm64-kernel
          path: build/arm/kernel_arm.bin
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-x86_64 ]
    # Only run on a version tag push (e.g. v1.0, v1.1)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download x86_64 ISO
        uses: actions/download-artifact@v4
        with:
          name: passos-x86_64-iso
          path: release/

      - name: Download x86_64 kernel
        uses: actions/download-artifact@v4
        with:
          name: passos-x86_64-kernel
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: PassOS ${{ github.ref_name }}
          body: |
            ## PassOS ${{ github.ref_name }}

            ### Downloads
            | File | Description |
            |---|---|
            | `passos.iso` | Bootable ISO for x86-64 (BIOS + UEFI) |
            | `kernel.bin` | Flat kernel binary (x86-64) |

            ### Flashing to USB
            **Linux:** `sudo dd if=passos.iso of=/dev/sdX bs=4M status=progress && sync`
            **Windows:** Use Rufus (DD mode) or Balena Etcher.

          files: |
            release/passos.iso
            release/kernel.bin
