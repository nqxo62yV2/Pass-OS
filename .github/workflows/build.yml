name: PassOS Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build x86-64 + ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm binutils xorriso mtools

      - name: Create build directories
        run: mkdir -p build/obj build/isoroot/boot/grub

      - name: Assemble bootloader (BIOS Stage 1)
        run: nasm -f bin boot/bios/boot.asm -o build/boot.bin

      - name: Assemble bootloader (BIOS Stage 2)
        run: nasm -f bin boot/bios/stage2.asm -o build/stage2.bin

      - name: Assemble kernel
        run: |
          nasm -f elf64 kernel/kernel.asm      -o build/obj/kernel.o
          nasm -f elf64 kernel/memory.asm      -o build/obj/memory.o
          nasm -f elf64 kernel/interrupts.asm  -o build/obj/interrupts.o
          nasm -f elf64 kernel/scheduler.asm   -o build/obj/scheduler.o
          nasm -f elf64 kernel/system.asm      -o build/obj/system.o

      - name: Assemble drivers
        run: |
          nasm -f elf64 drivers/display/display.asm   -o build/obj/display.o
          nasm -f elf64 drivers/keyboard/keyboard.asm -o build/obj/keyboard.o
          nasm -f elf64 drivers/storage/storage.asm   -o build/obj/storage.o
          nasm -f elf64 drivers/usb/usb.asm           -o build/obj/usb.o
          nasm -f elf64 drivers/hardware/hardware.asm -o build/obj/hardware.o

      - name: Assemble security layer
        run: |
          nasm -f elf64 security/key_derivation.asm -o build/obj/key_derivation.o
          nasm -f elf64 security/encryption.asm     -o build/obj/encryption.o
          nasm -f elf64 security/secure_memory.asm  -o build/obj/secure_memory.o
          nasm -f elf64 security/authentication.asm -o build/obj/authentication.o
          nasm -f elf64 security/integrity.asm      -o build/obj/integrity.o

      - name: Assemble database layer
        run: |
          nasm -f elf64 database/database_storage.asm -o build/obj/database_storage.o
          nasm -f elf64 database/database.asm         -o build/obj/database.o
          nasm -f elf64 database/database_create.asm  -o build/obj/database_create.o
          nasm -f elf64 database/database_delete.asm  -o build/obj/database_delete.o
          nasm -f elf64 database/database_search.asm  -o build/obj/database_search.o
          nasm -f elf64 database/database_export.asm  -o build/obj/database_export.o

      - name: Assemble interface layer
        run: |
          nasm -f elf64 interface/terminal.asm       -o build/obj/terminal.o
          nasm -f elf64 interface/command_parser.asm -o build/obj/command_parser.o
          nasm -f elf64 interface/table.asm          -o build/obj/table.o
          nasm -f elf64 interface/navigation.asm     -o build/obj/navigation.o
          nasm -f elf64 interface/text_editor.asm    -o build/obj/text_editor.o
          nasm -f elf64 interface/commands.asm       -o build/obj/commands.o
          nasm -f elf64 settings/settings.asm        -o build/obj/settings.o
          nasm -f elf64 updates/update.asm           -o build/obj/update.o
          nasm -f elf64 installer/installer.asm      -o build/obj/installer.o

      - name: Link kernel ELF
        run: |
          ld -T scripts/linker.ld -o build/kernel.elf \
            build/obj/kernel.o \
            build/obj/memory.o \
            build/obj/interrupts.o \
            build/obj/scheduler.o \
            build/obj/system.o \
            build/obj/display.o \
            build/obj/keyboard.o \
            build/obj/storage.o \
            build/obj/usb.o \
            build/obj/hardware.o \
            build/obj/key_derivation.o \
            build/obj/encryption.o \
            build/obj/secure_memory.o \
            build/obj/authentication.o \
            build/obj/integrity.o \
            build/obj/database_storage.o \
            build/obj/database.o \
            build/obj/database_create.o \
            build/obj/database_delete.o \
            build/obj/database_search.o \
            build/obj/database_export.o \
            build/obj/terminal.o \
            build/obj/command_parser.o \
            build/obj/table.o \
            build/obj/navigation.o \
            build/obj/text_editor.o \
            build/obj/commands.o \
            build/obj/settings.o \
            build/obj/update.o \
            build/obj/installer.o

      - name: Extract flat binary
        run: objcopy -O binary build/kernel.elf build/kernel.bin

      - name: Create ISO image
        run: |
          cp build/kernel.bin build/isoroot/boot/kernel.bin
          cp build/boot.bin   build/isoroot/boot/boot.bin
          cp build/stage2.bin build/isoroot/boot/stage2.bin
          cat > build/isoroot/boot/grub/grub.cfg << 'EOF'
          set timeout=3
          set default=0
          menuentry "PassOS V1.0" {
              multiboot2 /boot/kernel.bin
              boot
          }
          EOF
          xorriso -as mkisofs \
            -b boot/boot.bin \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -iso-level 3 \
            -r -J \
            -o build/passos.iso \
            build/isoroot

      - name: Show build artifact sizes
        run: |
          echo "=== Build Artifacts ==="
          ls -lh build/boot.bin build/kernel.elf build/kernel.bin build/passos.iso

      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: passos-x86_64-kernel
          path: build/kernel.bin
          retention-days: 30

      - name: Upload ISO image
        uses: actions/upload-artifact@v4
        with:
          name: passos-x86_64-iso
          path: build/passos.iso
          retention-days: 30

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 cross-toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Install NASM
        run: sudo apt-get install -y nasm

      - name: Create build directories
        run: mkdir -p build/arm/obj

      - name: Assemble ARM64 boot entry
        run: |
          aarch64-linux-gnu-as \
            -o build/arm/obj/boot_arm.o \
            boot/arm/boot_arm.asm

      - name: Assemble ARM64 kernel modules
        run: |
          for src in \
            kernel/kernel.asm \
            kernel/memory.asm \
            kernel/interrupts.asm \
            kernel/scheduler.asm \
            kernel/system.asm \
            drivers/display/display.asm \
            drivers/keyboard/keyboard.asm \
            drivers/storage/storage.asm \
            drivers/usb/usb.asm \
            drivers/hardware/hardware.asm \
            security/key_derivation.asm \
            security/encryption.asm \
            security/secure_memory.asm \
            security/authentication.asm \
            security/integrity.asm \
            database/database_storage.asm \
            database/database.asm \
            database/database_create.asm \
            database/database_delete.asm \
            database/database_search.asm \
            database/database_export.asm \
            interface/terminal.asm \
            interface/command_parser.asm \
            interface/table.asm \
            interface/navigation.asm \
            interface/text_editor.asm \
            interface/commands.asm \
            settings/settings.asm \
            updates/update.asm \
            installer/installer.asm
          do
            base=$(basename "$src" .asm)
            aarch64-linux-gnu-as -o "build/arm/obj/${base}.o" "$src"
          done

      - name: Link ARM64 kernel
        run: |
          aarch64-linux-gnu-ld \
            -T scripts/linker_arm.ld \
            -o build/arm/kernel_arm.elf \
            build/arm/obj/*.o

      - name: Extract ARM64 flat binary
        run: |
          aarch64-linux-gnu-objcopy \
            -O binary \
            build/arm/kernel_arm.elf \
            build/arm/kernel_arm.bin

      - name: Show ARM64 artifact size
        run: ls -lh build/arm/kernel_arm.bin

      - name: Upload ARM64 kernel
        uses: actions/upload-artifact@v4
        with:
          name: passos-arm64-kernel
          path: build/arm/kernel_arm.bin
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-x86_64, build-arm64 ]
    # Only run on a version tag push (e.g. v1.0, v1.1)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download x86_64 ISO
        uses: actions/download-artifact@v4
        with:
          name: passos-x86_64-iso
          path: release/

      - name: Download x86_64 kernel
        uses: actions/download-artifact@v4
        with:
          name: passos-x86_64-kernel
          path: release/

      - name: Download ARM64 kernel
        uses: actions/download-artifact@v4
        with:
          name: passos-arm64-kernel
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: PassOS ${{ github.ref_name }}
          body: |
            ## PassOS ${{ github.ref_name }}

            ### Downloads
            | File | Description |
            |---|---|
            | `passos.iso` | Bootable ISO for x86-64 (BIOS + UEFI) |
            | `kernel.bin` | Flat kernel binary (x86-64) |
            | `kernel_arm.bin` | Flat kernel binary (ARM64 / Raspberry Pi) |

            ### Flashing to USB
            **Linux:** `sudo dd if=passos.iso of=/dev/sdX bs=4M status=progress && sync`
            **Windows:** Use Rufus (DD mode) or Balena Etcher.

          files: |
            release/passos.iso
            release/kernel.bin
            release/kernel_arm.bin
